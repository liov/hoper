# 与 client/app/macos Podfile `platform :osx` 一致，避免 librb.a 链入时出现 deployment target 警告
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-mmacosx-version-min=10.15"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-mmacosx-version-min=10.15"]

[target.x86_64-pc-windows-gnu]
linker = "D:/sdk/msys64/ucrt64/bin/x86_64-w64-mingw32-gcc"
