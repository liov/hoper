org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# 新插件一般不再需要 Jetifier；若某老 AAR 报 support 冲突再改回 true
android.enableJetifier=false
# Flutter 3.44+ 推荐 JDK 17：flutter config --jdk-dir=<JDK17>
# Flutter 3.44+ Built-in Kotlin（app 已移除 kotlin-android；插件仍可能走 settings 里的 KGP）
android.builtInKotlin=true
android.newDsl=true
# Windows：Pub 缓存在 C:、项目在 D: 时 Kotlin 增量编译跨盘符会失败
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
# 仅 arm64：阻止 Flutter 插件把 abiFilters 重置为 armeabi-v7a|arm64|x86_64
disable-abi-filtering=true
target-platform=android-arm64
android.adbInstallTimeout=600000