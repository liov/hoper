# 团队共用 debug 签名
# 背景：各机器默认 ~/.android/debug.keystore 不同，同包名 debug 包无法覆盖安装，
# Flutter 会先 Uninstalling old version... 再重装（本地数据可能被清）。
#
# 用法：
#   1. 若尚无 team-debug.keystore，在 android/ 目录执行：
#      keytool -genkey -v -keystore team-debug.keystore -storepass android -alias androiddebugkey \
#        -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
#        -dname "CN=Android Debug,O=Android,C=US"
#   2. 将 team-debug.keystore 提交仓库，团队成员 pull 后共用同一 debug 证书
#
storePassword=android
keyPassword=android
keyAlias=androiddebugkey
storeFile=team-debug.keystore
