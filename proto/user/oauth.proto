syntax = "proto3";
package user;

import "hopeio/response/response.proto";
import "google/api/annotations.proto";

import "protoc-gen-openapiv2/options/annotations.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/hopeio/protobuf/user";
option java_package = "xyz.hoper.protobuf.user";
option java_multiple_files = true;

message OauthReq{
    string responseType =1;
    string clientID =2;
    string scope =3;
    string redirectURI =4;
    string state =5;
    string userID =6;
    int64 accessTokenExp =7;
    string clientSecret =11;
    string code =12;
    string refreshToken =13;
    string grantType = 14;
    string accessType = 15;
    string loginURI = 16;
}

message OauthClient {
    string ID = 1;
    string secret = 2;
    string domain = 3;
    string userID = 4;
}

service OauthService{
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
      description: "Oauth相关接口"
    };
    rpc OauthAuthorize (OauthReq) returns (response.HttpResponse) {
      option (google.api.http) = {
        get: "/oauth/authorize"
      };
      option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
        tags:["用户相关接口", "v1.0.0", "oauth"]
        summary : "oauth验证"
        description : "oauth验证"
      };

    }

    rpc OauthToken (OauthReq) returns (response.HttpResponse) {
      option (google.api.http) = {
        post: "/oauth/access_token"
        body: "*"
      };
      option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
        tags:["用户相关接口", "v1.0.0", "oauth"]
        summary : "签发token"
        description : "签发token"
      };

    }
  }